name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # The deck tests render Manim scenes and export PPTX, so the full
      # toolchain has to be here. Without it 30-odd tests error out on import
      # and the run tells you nothing.
      # fonts-noto-cjk is not optional: the scenes ask Pango for
      # "Noto Sans CJK KR" and without it the Korean glyphs fall back, one of
      # them loses its fill colour, and test_swarm_future_uses_caution fails on
      # a colour contract that is actually fine.
      - name: Install Manim system libraries and the Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev ffmpeg fonts-noto-cjk
          fc-cache -f
          fc-list | grep -c "Noto Sans CJK" || (echo "Noto Sans CJK missing" >&2; exit 1)
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Byte-compile tooling
        run: python -m py_compile tools/build_presentation_site.py tools/oracle_web/*.py

      # Run from the repository root: several tests resolve deck paths and
      # spawn subprocesses relative to it.
      - name: Unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Build the Pages site
        run: python tools/build_presentation_site.py --output /tmp/site-check
